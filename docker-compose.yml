version: "3.9"

# ────────────────────────────────────────────────────────────────
# 케어링 (Caring Ansimcall) — Docker Compose
#
# 빠른 시작:
#   git clone https://github.com/noivan0/caring-ansimcall.git
#   cd caring-ansimcall
#   cp .env.example .env        # DB_PASSWORD, SECRET_KEY 설정
#   docker compose up -d
#   # http://localhost:8001/app
#   # 체험계정: guardian@caring.kr / caring1234
# ────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caring-api
    ports:
      - "${HOST_PORT:-8001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caring_db}
      DB_USER: ${DB_USER:-caring}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql://${DB_USER:-caring}:${DB_PASSWORD}@db:5432/${DB_NAME:-caring_db}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3001}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: caring-db
    environment:
      POSTGRES_DB: ${DB_NAME:-caring_db}
      POSTGRES_USER: ${DB_USER:-caring}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-caring_secret}
    volumes:
      - caring_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-caring} -d ${DB_NAME:-caring_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: caring-redis
    restart: unless-stopped
    volumes:
      - caring_redis_data:/data

volumes:
  caring_db_data:
  caring_redis_data:
